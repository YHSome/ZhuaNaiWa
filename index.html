<!-- 奶蛙麻将风主题 -->
<style>
/* ==========================================================================
   奶蛙 · 麻将风主题（覆盖层，v3）
   不改动 xlegex 构建产物，只在 bundle CSS 之后追加覆盖样式。

   实测关键数据（390x844 视口）：
     · 托盘 div[w-295px] 原样式 box-sizing:border-box + 4px 边框 → 内容区只有 287px，
       而 7 个 40px 槽位需要 295px → 与背景分隔线必然错位
     · 落牌是 flex 子元素，无缩放时每张占 40px 布局宽、gap 3px → 节距 43px
     · 牌上 transform:scale() 不改变布局，只缩小视觉盒（40 → 37.6，左右各内缩 1.2px）

   对齐方案：托盘改 content-box（内容 295px = 原版尺寸，总宽仍 295+8=303 不跳动），
             7 槽 = 7×40 + 6×2.5 = 295 → gap:2.5px + flex-start，
             分隔线用同一节距 42.5px 画在 padding-box 上。

   结构对应：
     #app > div[flex flex-col]
       ├ div[text-44px …]        ← 标题（两侧加小麻将牌装饰）
       ├ div[flex-1] > div[relative flex-1]（牌堆整体缩放）
       │     ├ div.card[data-v-a0e0f0b7] > img + div.mask   ← 麻将牌
       │     └ div[w-295px][h-44px][border]                 ← 底部木槽
       ├ div[h-50px] > button ×2                            ← 道具按钮
       └ div[pb-10px]                                       ← 署名行
   ========================================================================== */

:root {
  --tile-hi: #fffdf6;
  --tile-face: #f7eed6;
  --tile-lo: #e8dab6;
  --tile-edge: #c69a5c;
  --tile-line: #3a2914;
  --felt-hi: #93dc77;
  --felt-mid: #4f9f46;
  --felt-lo: #2a6631;
  --wood-hi: #b3833a;
  --wood-mid: #8a5c22;
  --wood-lo: #5d3a12;
  /* 木槽尺寸：手机上尽量占满宽度，槽位/图案都放大一档（"UI 太小"的主要反馈点） */
  --slot-w: 38px;      /* 一个槽位的布局宽 */
  --slot-gap: 2px;     /* 9×38 + 8×2 = 358 = 托盘内容宽 */
  --slot-pitch: 40px;
  --tray-w: 358px;     /* 总宽 358 + 4×2 边框 = 366，390 宽的手机留 12px 边距 */
  --table-w: 500px;    /* 桌面端牌桌宽度：HUD / 进度条 / 面板都按它对齐 */
}

/* 中等窄屏（≤381）：槽位 34，托盘外宽 330 */
@media (max-width: 381px) {
  :root { --slot-w: 34px; --slot-pitch: 36px; --tray-w: 322px; }
}
/* 极小屏（≤345）：槽位 30，托盘外宽 294 */
@media (max-width: 345px) {
  :root { --slot-w: 30px; --slot-pitch: 32px; --tray-w: 286px; }
}

/* ---------- 1. 场景：木纹台面 + 绒面牌桌 ---------- */
html, body { overflow: hidden; }

body {
  background:
    repeating-linear-gradient(90deg,
      rgba(255, 255, 255, .04) 0 2px,
      rgba(0, 0, 0, .07) 2px 3px,
      rgba(0, 0, 0, .02) 3px 44px,
      rgba(255, 255, 255, .035) 44px 46px,
      rgba(0, 0, 0, .08) 46px 47px,
      rgba(0, 0, 0, .02) 47px 96px),
    radial-gradient(90% 70% at 50% 12%, #7c5226 0%, #563418 45%, #221302 100%);
}

#app {
  position: relative;
  overflow: hidden;
  /* 层级：绒面点阵 → 斜格纹 → 顶部环境光 → 牌堆聚焦光 → 暗角 → 绒面底色 */
  background-image:
    radial-gradient(rgba(255, 255, 255, .10) 1.1px, transparent 1.3px),
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .035) 0 2px, transparent 2px 26px),
    repeating-linear-gradient(-45deg, rgba(0, 0, 0, .035) 0 2px, transparent 2px 26px),
    radial-gradient(150% 58% at 50% 3%, rgba(255, 255, 255, .34) 0%, rgba(255, 255, 255, 0) 62%),
    radial-gradient(60% 44% at 50% 40%, rgba(255, 255, 255, .22) 0%, rgba(255, 255, 255, 0) 74%),
    radial-gradient(128% 118% at 50% 46%, rgba(0, 0, 0, 0) 48%, rgba(7, 22, 9, .46) 100%),
    radial-gradient(125% 115% at 50% 46%, var(--felt-hi) 0%, var(--felt-mid) 46%, var(--felt-lo) 100%);
  background-size: 22px 22px, auto, auto, auto, auto, auto, auto;
  box-shadow: inset 0 0 90px rgba(6, 24, 8, .45);
}

/* 绒面内沿的缝线（画在牌堆之下，只在边缘可见） */
#app::before {
  content: '';
  position: absolute;
  inset: 12px;
  border: 2px dashed rgba(255, 255, 255, .16);
  border-radius: 22px;
  pointer-events: none;
}

@media (min-width: 620px) {
  body { padding: 26px; box-sizing: border-box; align-items: center; justify-content: center; }
  #app {
    width: var(--table-w);          /* 固定宽度，别让 flex 把牌桌拉成一条 */
    max-width: 500px;
    border-radius: 30px;
    overflow: hidden;
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, .10),
      0 0 0 10px var(--wood-mid),
      0 0 0 12px var(--wood-lo),
      0 0 0 13px rgba(0, 0, 0, .5),
      inset 0 0 90px rgba(6, 24, 8, .45),
      0 30px 70px rgba(0, 0, 0, .62);
  }
}

/* ---------- 2. 标题：贴纸描边 + 两侧小麻将牌 ---------- */
#app > div > div[text-44px] {
  font-size: 40px !important;
  font-weight: 900 !important;
  letter-spacing: .12em;
  color: #fff7da !important;
  padding-top: 8px;
  text-shadow:
    3px 0 0 var(--tile-line), -3px 0 0 var(--tile-line),
    0 3px 0 var(--tile-line), 0 -3px 0 var(--tile-line),
    2px 2px 0 var(--tile-line), -2px -2px 0 var(--tile-line),
    2px -2px 0 var(--tile-line), -2px 2px 0 var(--tile-line),
    0 7px 0 var(--wood-mid), 0 11px 16px rgba(0, 0, 0, .45);
}

#app > div > div[text-44px]::before,
#app > div > div[text-44px]::after {
  content: '';
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  margin: 0 12px;
  border: 2px solid var(--tile-line);
  border-radius: 6px;
  background: linear-gradient(180deg, var(--tile-hi) 0%, var(--tile-face) 58%, var(--tile-lo) 100%);
  box-shadow:
    0 3px 0 var(--tile-edge),
    0 5px 0 var(--tile-line),
    0 6px 8px rgba(0, 0, 0, .38);
}

#app > div > div[text-44px]::before { transform: rotate(-13deg); }
#app > div > div[text-44px]::after { transform: rotate(13deg); }

/* ---------- 3. 麻将牌 ---------- */
.card[data-v-a0e0f0b7] {
  box-sizing: border-box;
  width: 40px;
  height: 40px;
  border: 2px solid var(--tile-line);
  border-radius: 7px;
  background: linear-gradient(180deg, var(--tile-hi) 0%, var(--tile-face) 58%, var(--tile-lo) 100%);
  box-shadow:
    0 3px 0 var(--tile-edge),
    0 5px 0 var(--tile-line),
    0 7px 9px rgba(14, 34, 10, .45),
    inset 0 2px 0 rgba(255, 255, 255, .95),
    inset 0 -3px 5px rgba(150, 116, 66, .3);
  /* 只过渡滤镜；transform 交给 WAAPI 动画，避免落牌时叠加一段 100ms 的过渡 */
  transition: filter .1s ease;
  /* 手机端关键三件套：立刻响应轻点、不弹图片长按菜单、不选中文字 */
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* 牌堆里的牌保留 hover 上浮（按下反馈要脆，transition 给短一点） */
#app div[relative][flex-1] > .card[data-v-a0e0f0b7] {
  transition: transform .06s ease, filter .1s ease;
}

.card[data-v-a0e0f0b7] img {
  width: 30px;
  height: 30px;
  border-radius: 5px;
  /* 沿 alpha 轮廓的一层极淡投影：浅色/发光素材在奶白牌面上也能"站住" */
  filter: drop-shadow(0 1px 1.5px rgba(72, 46, 14, .45));
}

/* ★ 触屏设备上绝不产生 hover 状态 ★
   否则 iOS Safari 认为"这个元素有 hover"，轻点第一次只触发 hover、第二次才 click
   （用户反馈的"单击按不了、要长按才能选中"就是这个原因） */
@media (hover: hover) and (pointer: fine) {
  .card[data-v-a0e0f0b7]:hover { transform: translateY(-2px); }
}

/* 被压住的牌：暖色压暗 + 降饱和，比纯黑蒙层干净 */
.mask[data-v-a0e0f0b7] {
  width: 100% !important;
  height: 100% !important;
  top: 0;
  left: 0;
  border-radius: 5px;
  background: linear-gradient(180deg, rgba(38, 28, 12, .30) 0%, rgba(28, 20, 8, .40) 100%);
  backdrop-filter: saturate(.55) brightness(.86);
  -webkit-backdrop-filter: saturate(.55) brightness(.86);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, .3);
}

/* 牌堆整体放大，牌桌才不空（JS 用 clientWidth 布点，transform 不影响命中）
   移动端从 1.18 提到 1.34：反馈"UI 太小"主要就来自牌面偏小；
   大塔时由 fitBoard() 按可用空间自动缩回（最低 0.62） */
@media (max-width: 619px) {
  #app div[relative][flex-1] { transform: scale(1.34); transform-origin: 50% 46%; }
}
@media (min-width: 620px) {
  #app div[relative][flex-1] { transform: scale(1.34); transform-origin: 50% 46%; }
  /* 桌面端牌桌更宽裕：牌堆整体往中间压一点，让"标题—牌堆—木槽"三段留白均衡 */
  #app div[relative][flex-1] > .card[data-v-a0e0f0b7] { translate: 0 22px; }
}

/* ---------- 4. 底部木槽（槽位与落牌严格对齐） ---------- */
#app div[w-295px][h-44px] {
  /* content-box：内容宽由 --tray-w 决定（原版 7 格是 295px，现在 9 格 322px） */
  box-sizing: content-box;
  width: var(--tray-w) !important;
  border: 4px solid var(--wood-lo) !important;
  border-radius: 15px;
  /* 分隔线画在 padding-box 上，节距与落牌一致：40px 槽 + 2.5px 缝 */
  background-origin: padding-box;
  background-clip: padding-box;
  background-image:
    repeating-linear-gradient(90deg,
      rgba(0, 0, 0, .20) 0 1.6px,
      rgba(255, 255, 255, .08) 1.6px 2.5px,
      rgba(0, 0, 0, 0) 2.5px var(--slot-pitch)),
    linear-gradient(180deg, var(--wood-hi) 0%, var(--wood-mid) 55%, var(--wood-lo) 100%);
  box-shadow:
    inset 0 6px 12px rgba(0, 0, 0, .52),
    inset 0 -2px 0 rgba(255, 255, 255, .14),
    0 4px 0 rgba(0, 0, 0, .3),
    0 8px 14px rgba(0, 0, 0, .28);
  padding: 0;
  gap: var(--slot-gap);
  justify-content: flex-start;   /* 落牌从左往右填，位置固定，不再居中漂移 */
  align-items: center;

.nw-sub { margin: 0 0 14px; text-align: center; font-size: 12px; color: #6b5a3a; letter-spacing: .04em; }

/* ---------- 选关格子（麻将牌造型） ---------- */
.nw-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.nw-lv {
  pointer-events: auto;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 14px 10px;
  min-height: 108px;                /* 触控目标够大 */
  font-family: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  color: #4a2f0c;
  border: 2px solid var(--tile-line, #3a2914);
  border-radius: 14px;
  background: linear-gradient(180deg, #fffdf6 0%, #f7eed6 58%, #e8dab6 100%);
  box-shadow:
    0 3px 0 var(--tile-edge, #c69a5c),
    0 5px 0 var(--tile-line, #3a2914),
    0 8px 12px rgba(14, 34, 10, .35),
    inset 0 2px 0 rgba(255, 255, 255, .95);
  cursor: pointer;
  transition: transform .1s ease, filter .1s ease;
}
.nw-lv.is-locked { filter: grayscale(.65) brightness(.9); cursor: not-allowed; }
.nw-lv b { font-size: 17px; font-weight: 900; letter-spacing: .06em; }
.nw-lv:active { transform: translateY(1px); }
.nw-lv em { font-size: 12.5px; font-style: normal; color: #7a6440; }
.nw-lv i {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  margin-bottom: 3px;
  font-size: 20px;
  font-weight: 900;
  font-style: normal;
  color: #fff7da;
  border-radius: 10px;
  border: 2px solid var(--tile-line, #3a2914);
  background: linear-gradient(180deg, #8fd06f, #4f9f46);
  text-shadow: 0 2px 0 rgba(0, 0, 0, .3);
}
.nw-lv.is-locked i { background: linear-gradient(180deg, #b9c0b4, #7c867a); }
.nw-lv.is-cleared::after {
  content: '✔';
  position: absolute;
  top: 5px;
  right: 9px;
  font-size: 14px;
  font-weight: 900;
  color: #3f9c47;
  text-shadow: 0 1px 0 #fff;
  animation: nw-star .5s cubic-bezier(.34, 1.6, .5, 1);
}
@keyframes nw-star { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
.nw-lv__time { font-size: 10px; color: #8a7550; margin-top: 1px; }
/* 关卡格子里的评星行 */
.nw-lv__stars { font-size: 13px; letter-spacing: 2px; line-height: 1; color: #c9b489; }
.nw-lv__stars.has { color: #f2b23f; text-shadow: 0 1px 0 #7a4d16; }

/* 无尽模式格子：整行横幅 + 火系配色 */
.nw-lv--endless {
  grid-column: 1 / -1;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 74px;
  padding: 12px 14px;
  border-color: #8a3a12;
  background: linear-gradient(180deg, #fff6de 0%, #ffe3ac 58%, #f6c069 100%);
}
.nw-lv--endless i { margin-bottom: 0; background: linear-gradient(180deg, #ff9d4d, #e8422a); }
.nw-lv--endless em { color: #8a4a12; }
.nw-lv--endless .nw-lv__stars { font-size: 17px; }
.nw-lv--endless.is-locked { filter: grayscale(.6) brightness(.94); }

/* ---------- 结算评星 ---------- */
.nw-stars {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin: 6px 0 0;
  font-size: 40px;
  font-weight: 900;
  letter-spacing: 7px;
  line-height: 1.1;
  color: #f2b23f;
  text-shadow: 0 2px 0 #7a4d16, 0 0 12px rgba(255, 190, 90, .55);
  animation: nw-stars-pop .55s cubic-bezier(.34, 1.5, .5, 1);
}
.nw-stars small {
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0;
  color: #8a7550;
  text-shadow: none;
}
@keyframes nw-stars-pop {
  from { transform: scale(.5); opacity: 0; }
  60% { transform: scale(1.12); opacity: 1; }
  to { transform: none; opacity: 1; }
}

/* ---------- 键盘可达性 ---------- */
.nw-btn:focus-visible,
.nw-lv:focus-visible {
  outline: 3px solid #2f7de1;
  outline-offset: 3px;
}

/* ---------- 结算统计 ---------- */
.nw-stats { display: flex; justify-content: center; gap: 22px; margin: 14px 0 2px; }
.nw-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.nw-stat b { font-size: 24px; font-weight: 900; color: #d9822b; }
.nw-stat span { font-size: 12.5px; color: #7a6440; }

.nw-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
.nw-tip { margin: 10px 0 0; font-size: 13.5px; line-height: 1.75; color: #6b5a3a; }
.nw-tip b { color: #4a2f0c; }
.nw-help { margin: 6px 0 0; padding-left: 20px; font-size: 14px; line-height: 1.95; color: #5f5137; }
.nw-help b { color: #4a2f0c; }

/* ---------- 顶部过关提醒（游戏自带的"第 N 关"之外，再加一个轻提示条） ---------- */
.nw-flash {
  position: absolute;
  left: 50%;
  top: 22%;
  transform: translateX(-50%);
  padding: 8px 18px;
  border-radius: 999px;
  border: 2px solid var(--tile-line, #3a2914);
  background: linear-gradient(180deg, #ffe9a8, #f2b23f);
  color: #4a2f0c;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: .06em;
  white-space: nowrap;
  box-shadow: 0 3px 0 var(--wood-mid, #8a5c22), 0 8px 16px rgba(0, 0, 0, .35);
  animation: nw-flash 1.1s ease forwards;
}
@keyframes nw-flash {
  0% { opacity: 0; transform: translate(-50%, 8px) scale(.85); }
  18% { opacity: 1; transform: translate(-50%, 0) scale(1.04); }
  75% { opacity: 1; transform: translate(-50%, 0) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -14px) scale(.98); }
}

/* ---------- "难度飙升"过渡页 ---------- */
.nw-center { text-align: center; }

.nw-spike {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0 auto 10px;
  padding: 5px 18px;
  border-radius: 999px;
  border: 2px solid var(--tile-line, #3a2914);
  background: linear-gradient(180deg, #ffa963, #f0742c);
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: .1em;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .28);
  box-shadow: 0 3px 0 #a83c14, 0 7px 14px rgba(0, 0, 0, .35);
  animation: nw-spike 1.2s ease-in-out infinite;
}
@keyframes nw-spike {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-3px) scale(1.045); }
}

.nw-title--sm { font-size: 24px; letter-spacing: .08em; }

.nw-compare {
  margin: 14px 0 10px;
  border: 2px solid rgba(58, 41, 20, .22);
  border-radius: 14px;
  overflow: hidden;
  background: rgba(255, 255, 255, .55);
}
.nw-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 14px;
  font-size: 13px;
  color: #5f5137;
}
.nw-row + .nw-row { border-top: 1px dashed rgba(58, 41, 20, .18); }
.nw-row b { color: #4a2f0c; font-size: 14px; }
.nw-row i { font-style: normal; color: #9c8a64; margin: 0 8px; }
.nw-row b.up { color: #d9822b; }

.nw-diff {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 4px 0 2px;
  font-size: 12px;
  color: #7a6440;
}
.nw-dots { display: inline-flex; gap: 4px; }
.nw-dots span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgba(58, 41, 20, .16);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6);
}
.nw-dots span.on { background: linear-gradient(180deg, #ffd05e, #ef8f2b); }

.nw-auto { margin: 10px 0 0; text-align: center; font-size: 12px; color: #8a7550; }

@media (max-width: 430px) {
  /* 顶栏收窄：去掉关卡名，保证一行放得下（否则按钮会被挤到第二行压住标题） */
  .nw-chip small { display: none; }
}
@media (max-width: 360px) {
  [data-el="time"] { display: none; }
}
@media (max-width: 430px) {
  .nw-title { font-size: 28px; }
  .nw-grid { gap: 11px; }
  /* 手机上不要再缩格子：保持 40px 数字牌 + 17px 关卡名，单手点得准 */
  .nw-lv { padding: 12px 7px; min-height: 104px; }
  .nw-lv i { width: 40px; height: 40px; font-size: 20px; }
  .nw-chip { font-size: 14.5px; padding: 7px 12px; }
  .nw-btn { height: 40px; padding: 0 13px; font-size: 14.5px; }
  .nw-btn--lg { height: 50px; padding: 0 22px; font-size: 16.5px; }
  .nw-tip { font-size: 13px; }
  .nw-sub { font-size: 12.5px; }
}
/* 窄屏顶栏只留图标，保证两枚 chip 不被挤到第二行 */
@media (max-width: 400px) {
  .nw-txt { display: none; }
  .nw-btn { padding: 0 11px; }
}
/* ---------- 矮屏（手机竖放偏矮 / 横放）：牌堆优先，顶栏上移、面板压缩 ---------- */
@media (max-height: 620px) {
  /* 短屏把游戏大标题让出来给牌面，HUD 顶到最上面，可用高度多出约 75px */
  #nw-ui { --hud-top: calc(8px + env(safe-area-inset-top, 0px)); }
}
@media (max-height: 520px) {
  /* 竖向空间更紧：面板整体压缩、关卡排成一行 */
  #app > div > div[text-44px] { display: none; }
  #nw-ui { --hud-top: calc(6px + env(safe-area-inset-top, 0px)); }

  .nw-panel { padding: 12px 14px 10px; border-radius: 18px; }
  .nw-title { font-size: 22px; letter-spacing: .08em; }
  .nw-title--sm { font-size: 19px; }
  .nw-sub { margin-bottom: 8px; font-size: 12px; }
  .nw-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .nw-lv { min-height: 0; padding: 8px 4px; gap: 1px; border-radius: 12px; }
  .nw-lv i { width: 28px; height: 28px; font-size: 15px; margin-bottom: 1px; border-radius: 8px; }
  .nw-lv b { font-size: 14px; }
  .nw-lv em { font-size: 11px; }
  .nw-lv__time { font-size: 10px; }
  .nw-compare { margin: 8px 0 6px; }
  .nw-row { padding: 6px 12px; font-size: 13px; }
  .nw-stats { margin: 8px 0 0; }
  .nw-stat b { font-size: 20px; }
  .nw-actions { margin-top: 10px; gap: 8px; }
  .nw-btn { height: 36px; font-size: 14px; }
  .nw-btn--lg { height: 42px; font-size: 15px; }
  .nw-tip { margin-top: 6px; font-size: 12px; }
  .nw-spike { padding: 3px 14px; font-size: 13px; margin-bottom: 6px; }
}

@media (prefers-reduced-motion: reduce) {
  .nw-overlay, .nw-panel, .nw-flash, .nw-spike, .nw-stars, .nw-lv.is-cleared::after { animation: none !important; }
}

/* ---------- 全面屏底部安全区：木槽与道具按钮别被小黑条压住 ---------- */
@supports (padding: env(safe-area-inset-bottom)) {
  #app > div { padding-bottom: env(safe-area-inset-bottom, 0px); }
}

<script type="module">
/* ==========================================================================
   奶蛙 · 动效层（theme-cute.js）
   纯外挂脚本，不改动 xlegex 构建产物，靠 DOM 事件 + MutationObserver + WAAPI 生效：

     1. 抓牌：在牌堆里点一张 → 新落进托盘的牌从「被点那张牌的位置」飞进槽位（不是瞬移）
     2. 回退/移出：牌从托盘飞回牌堆原位
     3. 消除：托盘闪光 + 飘出「+3 消除」
     4. 开局：整副牌按层错峰"落桌"入场
     5. 一切动画都遵守 prefers-reduced-motion

   实现要点：
     · 牌堆容器有 CSS transform: scale(1.18/1.24)，而 WAAPI 的 translate 作用在元素局部坐标系，
       所以屏幕位移要除以祖先缩放比（否则飞行距离会放大 1.2 倍）
     · 托盘牌自带 transform: scale(.94)，动画首帧用 scale(1) 才能和牌堆里的 40px 视觉尺寸对齐，
       末帧回到 scale(.94) 与 CSS 无缝衔接
     · Vue 复用/移动节点时 MutationObserver 也会报 add/remove，用 WeakSet 区分"真新增"与"被搬动"
   ========================================================================== */
(function () {
  'use strict';

  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FLY_MS = 260;          // 飞入时长
  var PENDING_TTL = 700;     // 点击到落牌的匹配窗口(ms)
  var BRIDGE_MS = 200;       // 轻点兜底等待 click 的时间
  var TRAY_SEL = 'div[w-295px]';
  var SLOT_N = 9;            // 托盘槽位数（DOM 里画满 9 个）
  var DANGER_GAP = 2;        // 还剩几格时开始预警

  /** 当前容量：构建产物读 window.__NAIWA_CAP__（无尽模式会调小），这里保持一致 */
  function capNow() {
    var c = Number(window.__NAIWA_CAP__);
    return c >= 3 && c <= SLOT_N ? c : SLOT_N;
  }

  var seen = new WeakSet();      // 已登记过的牌元素
  var pending = null;            // { rect, alt, t } 最近一次点击的牌位
  var trayRemoved = [];          // 最近从托盘被移走的牌位（用于飞回）

  function q(sel, root) { return (root || document).querySelector(sel); }
  function rectOf(el) { try { return el.getBoundingClientRect(); } catch (e) { return null; } }

  /** 祖先缩放比（牌堆容器被整体 scale 过） */
  function ancestorScale(el) {
    try {
      var host = q('#app div[relative][flex-1]');
      if (!host) return 1;
      var t = getComputedStyle(host).transform;
      if (!t || t === 'none') return 1;
      var m = new DOMMatrixReadOnly(t);
      return m.a || 1;
    } catch (e) { return 1; }
  }

  /** 记录被点击的牌位（capture 阶段，先于 Vue 的 @click） */
  function record(ev) {
    try {
      var el = ev.target && ev.target.closest ? ev.target.closest('.card') : null;
      if (!el) return;
      var trayEl = q(TRAY_SEL);
      if (trayEl && trayEl.contains(el)) return;         // 托盘里的牌不算
      var r = rectOf(el);
      if (!r) return;
      pending = { rect: r, alt: (el.querySelector('img') || {}).alt || null, t: Date.now() };
      buzz(9);                                            // 抓牌轻震一下
    } catch (e) { /* 忽略 */ }
  }
  document.addEventListener('pointerdown', record, true);
  document.addEventListener('click', record, true);

  /** 从某处飞进最终位置 */
  function flyIn(el, srcRect) {
    if (REDUCED || !el.animate || !srcRect) return popIn(el);
    var dst = rectOf(el);
    if (!dst) return;
    var s = ancestorScale(el);
    var dx = (srcRect.left - dst.left) / s;
    var dy = (srcRect.top - dst.top) / s;
    // 首帧缩放按"牌堆里那张牌 / 托盘槽位"的真实尺寸比来定：
    // 牌堆在手机上会放大到 1.34~1.8，槽位只有 38px，不补偿就会看到"大牌突然变小小牌"
    var k0 = Math.max(0.6, Math.min(3, (srcRect.width / Math.max(1, dst.width)) / s));
    el.animate([
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + k0.toFixed(3) + ') rotate(-7deg)' },
      { transform: 'translate(' + dx * 0.45 + 'px,' + (dy * 0.45 - 20) + 'px) scale(' + (k0 * 0.8 + 0.2).toFixed(3) + ') rotate(3deg)', offset: 0.6 },
      { transform: 'translate(0,0) scale(.94) rotate(0deg)' },
    ], { duration: FLY_MS, easing: 'cubic-bezier(.22,.68,.3,1)' });
    return true;
  }

  /** 兜底：原地弹出（新关卡发牌、脚本点击等） */
  function popIn(el, delay) {
    if (REDUCED || !el.animate) return;
    el.animate([
      { transform: 'translate(0,-14px) scale(.86)', opacity: 0.2 },
      { transform: 'translate(0,0) scale(.94)', opacity: 1 },
    ], { duration: 220, delay: delay || 0, easing: 'cubic-bezier(.3,1.4,.5,1)' });
  }

  /** 回退：从托盘飞回牌堆 */
  function flyBack(el, srcRect) {
    if (REDUCED || !el.animate || !srcRect) return;
    var dst = rectOf(el);
    if (!dst) return;
    var s = ancestorScale(el);
    var dx = (srcRect.left - dst.left) / s;
    var dy = (srcRect.top - dst.top) / s;
    el.animate([
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.94) rotate(6deg)' },
      { transform: 'translate(0,0) scale(1) rotate(0deg)' },
    ], { duration: 240, easing: 'cubic-bezier(.3,.9,.3,1)' });
  }

  /* ------------------------------------------------------------------ *
   * 托盘槽位可视化：在木槽里画 9 个凹槽，占用越多越亮，≥7 格开始告警
   * 槽位盒是绝对定位的底板（z-index 低于牌），牌自己 z-index:1 盖在上面
   * ------------------------------------------------------------------ */
  function ensureSlots(trayEl) {
    var box = trayEl.querySelector(':scope > .nw-slots');
    if (box) return box;
    box = document.createElement('div');
    box.className = 'nw-slots';
    for (var i = 0; i < SLOT_N; i++) box.appendChild(document.createElement('i'));
    trayEl.insertBefore(box, trayEl.firstChild);
    return box;
  }

  function syncSlots(trayEl) {
    var box = ensureSlots(trayEl);
    var n = trayEl.querySelectorAll('.card').length;
    var cap = capNow();
    var pips = box.children;
    for (var i = 0; i < pips.length; i++) {
      pips[i].classList.toggle('is-full', i < n);
      pips[i].classList.toggle('is-blocked', i >= cap);      // 本局用不到的槽位（无尽模式会收窄）
    }
    var danger = n >= Math.max(1, cap - DANGER_GAP);
    trayEl.classList.toggle('is-danger', danger);
    trayEl.classList.toggle('is-critical', n >= cap - 1);
    trayEl.setAttribute('data-fill', String(n));
    trayEl.setAttribute('data-cap', String(cap));
    // 明确的文字告警：光靠颜色在高亮牌面上不够醒目
    var tag = trayEl.querySelector(':scope > .nw-slotwarn');
    if (danger) {
      if (!tag) {
        tag = document.createElement('div');
        tag.className = 'nw-slotwarn';
        tag.setAttribute('role', 'status');
        trayEl.appendChild(tag);
      }
      var left = cap - n;
      tag.textContent = left > 1 ? '只剩 ' + left + ' 格！' : left === 1 ? '最后一格！' : '没格子了！';
    } else if (tag) {
      tag.remove();
    }
    return n;
  }

  /** 触感反馈：手机上轻震，桌面端 navigator.vibrate 不存在会自动跳过 */
  function buzz(pattern) {
    try {
      if (localStorage.getItem('naiwa.haptics') === '0') return;
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) { /* 忽略 */ }
  }
  window.__NAIWA_BUZZ__ = buzz;

  /** 槽位告警：当占用跨过阈值时震一下（同一个状态只震一次） */
  function watchDanger(trayEl) {
    var last = 0;
    return function (n) {
      var cap = capNow();
      if (n >= Math.max(1, cap - DANGER_GAP) && last < Math.max(1, cap - DANGER_GAP)) buzz([14, 60, 14]);
      if (n >= cap - 1 && last < cap - 1) buzz([22, 50, 22]);
      last = n;
    };
  }

  /** 消除反馈：托盘闪一下 + 飘字 + 粒子 + 触感 */
  function matchFlash() {
    var trayEl = q(TRAY_SEL);
    if (!trayEl) return;
    trayEl.classList.remove('is-match');
    void trayEl.offsetWidth;                 // 强制重排以重放动画
    trayEl.classList.add('is-match');
    setTimeout(function () { trayEl.classList.remove('is-match'); }, 600);
    buzz([16, 40, 16]);
    if (REDUCED) return;
    var tag = document.createElement('div');
    tag.className = 'zw-float';
    tag.textContent = '+3 消除';
    trayEl.appendChild(tag);
    setTimeout(function () { tag.remove(); }, 950);
    burst(trayEl);
  }

  /** 星星粒子：从槽位中心往四周炸开（纯 DOM + WAAPI，无外部资源） */
  function burst(trayEl) {
    if (!trayEl.animate) return;
    var r = rectOf(trayEl);
    if (!r) return;
    var cx = r.width / 2, cy = r.height / 2;
    for (var i = 0; i < 10; i++) {
      var p = document.createElement('span');
      p.className = 'zw-spark';
      var ang = (Math.PI * 2 * i) / 10 + (i % 2 ? 0.3 : 0);
      var dist = 42 + (i % 3) * 22;
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      trayEl.appendChild(p);
      p.animate([
        { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
        { transform: 'translate(calc(-50% + ' + Math.cos(ang) * dist + 'px), calc(-50% + ' + Math.sin(ang) * dist + 'px)) scale(1.15)', opacity: 0 },
      ], { duration: 620 + (i % 4) * 60, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = function () { this.effect.target.remove(); };
    }
  }

  function watchTray() {
    var trayEl = q(TRAY_SEL);
    if (!trayEl) return requestAnimationFrame(watchTray);
    var checkDanger = watchDanger(trayEl);
    syncSlots(trayEl);
    new MutationObserver(function (muts) {
      var added = [], removed = 0;
      muts.forEach(function (m) {
        Array.prototype.forEach.call(m.addedNodes, function (n) {
          if (n.nodeType === 1 && n.classList && n.classList.contains('card')) added.push(n);
        });
        Array.prototype.forEach.call(m.removedNodes, function (n) {
          if (n.nodeType === 1 && n.classList && n.classList.contains('card')) {
            removed++;
            var r = rectOf(n);
            if (r) trayRemoved.push({ rect: r, t: Date.now() });
          }
        });
      });
      trayRemoved = trayRemoved.filter(function (it) { return Date.now() - it.t < 500; });

      added.forEach(function (el, i) {
        var isNew = !seen.has(el);
        seen.add(el);
        if (!isNew) return;                                    // 被 Vue 搬动的老牌，跳过
        var fresh = pending && Date.now() - pending.t < PENDING_TTL;
        var sameAlt = fresh && (!pending.alt || (el.querySelector('img') || {}).alt === pending.alt);
        if (sameAlt) {
          flyIn(el, pending.rect);
          pending = null;
        } else {
          popIn(el, i * 40);
        }
      });

      if (removed >= 3) matchFlash();
      checkDanger(syncSlots(trayEl));
    }).observe(trayEl, { childList: true });
  }

  function watchBoard() {
    var host = q('#app div[relative][flex-1]');
    if (!host) return requestAnimationFrame(watchBoard);
    new MutationObserver(function (muts) {
      var added = [];
      muts.forEach(function (m) {
        Array.prototype.forEach.call(m.addedNodes, function (n) {
          if (n.nodeType === 1 && n.classList && n.classList.contains('card')) added.push(n);
        });
      });
      var fresh = trayRemoved.filter(function (it) { return Date.now() - it.t < 500; });
      var bulk = added.filter(function (el) { return !seen.has(el); }).length + added.length >= 4;
      added.forEach(function (el, i) {
        var isNew = !seen.has(el);
        seen.add(el);
        if (!isNew) return;
        if (i < fresh.length) flyBack(el, fresh[i].rect);       // 从托盘飞回
        else if (bulk) popIn(el, Math.min(i, 24) * 14);         // 开局发牌：错峰落下
        else popIn(el, i * 40);
      });
      if (fresh.length) trayRemoved = [];
    }).observe(host, { childList: true });
  }

  function start() {
    window.__NAIWA_FX__ = 'on';               // 启动自检标记
    installTapBridge();
    watchTray();
    watchBoard();
  }

  /* ------------------------------------------------------------------ *
   * 手机端"轻点 → click"兜底桥接
   *
   * 背景：游戏只监听 click。某些移动浏览器会把轻点吞掉——
   *   · iOS Safari：元素带 :hover 样式时，第一次轻点只触发 hover，要点第二次才 click
   *     （已在 CSS 里用 @media (hover:hover) and (pointer:fine) 规避）
   *   · 部分安卓 WebView / 小程序容器：touchend 后不补 click
   *   · 图片长按弹系统菜单，反而"长按能选中"
   * 所以这里再兜一层：触摸抬起后若 200ms 内没等到 click，就自己补发一个，
   * 并给补发过的元素打时间戳；真 click 若姗姗来迟则丢弃，保证一次轻点只抓一张牌。
   * ------------------------------------------------------------------ */
  function installTapBridge() {
    if (!window.PointerEvent) return;
    window.__NAIWA_TAPBRIDGE__ = 'on';        // 启动自检标记
    var pending = null;

    function tapTarget(node) {
      if (!node || !node.closest) return null;
      return node.closest('.card, button, [data-act], [data-lv], [data-run], a, .icon-btn');
    }

    function tapLog(msg) { if (window.__NAIWA_TAPLOG__) window.__NAIWA_TAPLOG__.push(msg); }

    document.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse') return;                 // 鼠标不需要兜底
      clearPending();
      pending = { x: e.clientX, y: e.clientY, el: tapTarget(e.target), timer: 0 };
      tapLog('down type=' + e.pointerType + ' target=' + (e.target && e.target.tagName) + ' el=' + (pending.el ? pending.el.className : 'null'));
    }, true);

    document.addEventListener('pointerup', function (e) {
      if (e.pointerType === 'mouse' || !pending || !pending.el) { tapLog('up skipped type=' + e.pointerType + ' pending=' + !!pending + ' el=' + !!(pending && pending.el)); return; }
      var moved = Math.sqrt(Math.pow(e.clientX - pending.x, 2) + Math.pow(e.clientY - pending.y, 2));
      tapLog('up moved=' + Math.round(moved));
      if (moved > 12) { clearPending(); return; }             // 划动/滚动不补发
      var el = pending.el;
      pending.timer = setTimeout(function () {
        pending = null;
        if (!el.isConnected) { tapLog('timer fired 但元素已不在文档里'); return; }
        var ev = new MouseEvent('click', { bubbles: true, cancelable: true, view: window });
        // ★ 必须给事件实例直接挂标记：MouseEvent 的初始化字典会忽略未知字段，
        //   用 { __naiwaSynthetic: true } 传给构造函数是无效的，
        //   会导致下面那个"丢弃迟到 click"的监听器把补发的 click 也一起拦掉
        ev.__naiwaSynthetic = true;
        el.__naiwaBridgedAt = Date.now();
        el.dispatchEvent(ev);
        tapLog('synthetic click dispatched');
      }, BRIDGE_MS);
    }, true);

    document.addEventListener('pointercancel', function () { tapLog('pointercancel'); clearPending(); }, true);

    // 真 click 到达：取消待补发；若这个元素刚被补发过，就把迟到的 click 丢掉，避免抓两张
    document.addEventListener('click', function (e) {
      clearPending();
      if (e.__naiwaSynthetic) return;
      var el = tapTarget(e.target);
      if (el && el.__naiwaBridgedAt && Date.now() - el.__naiwaBridgedAt < 900) {
        e.stopPropagation();
        e.stopImmediatePropagation();
      }
    }, true);

    function clearPending() {
      if (pending && pending.timer) clearTimeout(pending.timer);
      pending = null;
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
<!-- UI 层（选关 / 结算 / 进度） -->
<script type="module">
/* ==========================================================================
   抓奶蛙 · UI 层（选关界面 / HUD / 结算面板 / 进度存档 / 音效开关）
   纯外挂脚本：不改游戏逻辑，只通过 window.__NAIWA__（由构建产物里注入的小接口）
   按编号开某一关；胜负则靠观察牌堆与托盘 DOM，以及劫持原生 alert 判定。
   ========================================================================== */
(function () {
  'use strict';

  var KEY_PROGRESS = 'naiwa.progress.v1';
  var KEY_MUTED = 'naiwa.muted';
  var TRAY_CAP = 9;                       // 托盘容量（与游戏内一致）

  /* 关卡表：与构建产物里的 LevelConfig 对应（3/1、4/2、6/2、9/2 → 9/24/36/54 张）
     star : [三星上限秒数, 二星上限秒数]，超过二星线只有一星
     第 5 项是无尽模式：塔一层层加高，配置在运行时算，不在那 4 条的配置表里 */
  var LEVELS = [
    { n: 1, name: '教程关', types: 3, tiles: 9,  stars: 1, star: [8, 16],   tip: '只有 3 种图案，怎么点都不会输' },
    { n: 2, name: '轻松关', types: 4, tiles: 24, stars: 2, star: [22, 42],  tip: '4 种图案，随便点点也能过' },
    { n: 3, name: '进阶关', types: 6, tiles: 36, stars: 4, star: [45, 80],  tip: '6 种图案，得看清被压住的方块了' },
    { n: 4, name: '挑战关', types: 9, tiles: 54, stars: 5, star: [75, 140], tip: '9 种图案全上，托盘很容易塞满，先用「移出前三个」救急' },
    { n: 5, name: '无尽模式', types: 9, tiles: 0, stars: 5, star: [0, 0], endless: true,
      tip: '一座塔清空马上起下一座，每塔再高一层；托盘满一次挑战就结束' },
  ];
  var ENDLESS = 5;                       // 无尽模式的"关卡号"
  var ENDLESS_MAX_LAYER = 6;             // 塔最高几层（小屏会自动降到 4~5 层，见 endlessMaxLayer）
  /** 小屏放不下 6 层：塔是环绕牌桌中心长的，屏越矮能放的层越少 */
  function endlessMaxLayer() {
    if (window.innerHeight < 620) return 4;
    if (window.innerHeight < 720) return 5;
    return ENDLESS_MAX_LAYER;
  }
  /* 无尽模式的难度曲线：塔变高 + 槽位变少。
     实测（endless-scale.mjs，用同一副牌换托盘容量 + 修正过遮挡方向的求解器）：
       · 9 格：2~6 层可解率 83%~100%，最优解峰值 7.2~7.7（9 格托盘已经只剩 1~2 格余量）
       · 8 格：可解率掉到 33%~50%
       · 7 格：0%~17%（基本靠运气，所以不做）
       · 层数本身也有影响：3 层峰值 7.7 > 2 层 7.4（同容量下更高的塔更紧）
     所以曲线是：第 1~2 塔给 9 格但塔比挑战关高一半，第 3 塔起收到 8 格（这时求解器都要重发一半才找得到通路）。 */
  var ENDLESS_MIN_CAP = 8;
  function endlessCap(tower) {
    if (tower <= 2) return 9;
    return ENDLESS_MIN_CAP;
  }
  function endlessTower(tower) {
    var layer = Math.min(2 + tower, endlessMaxLayer());
    var cap = endlessCap(tower);
    if (window.__NAIWA_LAYER_OVERRIDE__) layer = window.__NAIWA_LAYER_OVERRIDE__;   // 只给自动化测试用
    return { cardNum: 9, layer: layer, cap: cap, tiles: 27 * layer };
  }
  /** 按用时评星：3★ / 2★ / 1★ */
  function starFor(n, sec) {
    var t = info(n).star;
    if (sec <= t[0]) return 3;
    if (sec <= t[1]) return 2;
    return 1;
  }
  function starRow(k) {
    var s = '';
    for (var i = 0; i < 3; i++) s += (i < k ? '★' : '☆');
    return s;
  }

  /* ---------------- 存档 ---------------- */
  function loadProgress() {
    try {
      var p = JSON.parse(localStorage.getItem(KEY_PROGRESS) || '{}');
      return {
        unlocked: Math.max(1, Math.min(LEVELS.length, p.unlocked || 1)),
        cleared: Array.isArray(p.cleared) ? p.cleared : [],
        best: p.best && typeof p.best === 'object' ? p.best : {},
        stars: p.stars && typeof p.stars === 'object' ? p.stars : {},
        endlessBest: p.endlessBest || 0,        // 无尽模式最高爬到的塔数
        endlessTiles: p.endlessTiles || 0,      // 单次挑战最多清掉多少张
      };
    } catch (e) { return { unlocked: 1, cleared: [], best: {}, stars: {}, endlessBest: 0, endlessTiles: 0 }; }
  }
  function saveProgress() {
    try { localStorage.setItem(KEY_PROGRESS, JSON.stringify(progress)); } catch (e) { /* 忽略 */ }
  }
  var progress = loadProgress();
  var muted = localStorage.getItem(KEY_MUTED) === '1';

  /* ---------------- 运行时状态 ---------------- */
  var cur = progress.unlocked;      // 玩家当前选的关
  var playing = false;              // 是否处于"这一关进行中"（用于判定胜负）
  var pendingStart = false;
  var startAt = 0;
  var pausedAt = 0;
  var lastSeen = { left: 0, tray: 0 };   // 最近一次非空场面（失败瞬间游戏会立刻清空牌堆，得先记住）
  var dealTotal = 0;                     // 本关发牌总张数（用于进度条，从场面里量出来）
  var lastHudH = 0;                      // 顶栏实测高度：进度条跟着它往下排（字体变大后可能换行）
  var endless = { on: false, tower: 0, tiles: 0, startedAt: 0 };   // 无尽模式运行时状态

  /** 闸门：挡住游戏自带的"过关/失败后自动切关"定时器，避免覆盖玩家在面板里选的关卡 */
  function setHold(v) { window.__NAIWA_HOLD__ = !!v; }

  /* ---------------- DOM 骨架 ---------------- */
  var ui = document.createElement('div');
  ui.id = 'nw-ui';
  ui.innerHTML = [
    '<div class="nw-hud" data-el="hud">',
    '  <button class="nw-btn nw-btn--ghost" data-act="levels"><span class="nw-ico">☰</span><span class="nw-txt">选关</span></button>',
    '  <span class="nw-chip" data-el="level">第 1 关</span>',
    '  <span class="nw-hud__spacer"></span>',
    '  <span class="nw-chip" data-el="left">剩余 <b>0</b></span>',
    '  <span class="nw-chip" data-el="time">00:00</span>',
    '  <button class="nw-btn nw-btn--ghost" data-act="mute" title="音效开关">🔊</button>',
    '</div>',
    '<div class="nw-progress" data-el="barwrap" role="progressbar" aria-label="本关进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">',
    '  <i data-el="bar"></i>',
    '</div>',
    '<div class="nw-overlay" data-el="overlay" hidden>',
    '  <div class="nw-panel" data-el="panel"></div>',
    '</div>',
  ].join('');
  document.body.appendChild(ui);

  var el = {};
  ['level', 'left', 'time', 'overlay', 'panel', 'barwrap', 'bar', 'hud'].forEach(function (k) { el[k] = ui.querySelector('[data-el="' + k + '"]'); });
  var muteBtn = ui.querySelector('[data-act="mute"]');

  /* ---------------- 小工具 ---------------- */
  function fmtTime(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function info(n) { return LEVELS[Math.min(LEVELS.length, Math.max(1, n)) - 1]; }
  function boardCards() { return [].slice.call(document.querySelectorAll('.card')).filter(function (c) { return !c.closest('div[w-295px]'); }); }
  function trayCards() { var t = document.querySelector('div[w-295px]'); return t ? [].slice.call(t.querySelectorAll('.card')) : []; }
  function actionBtn(label, cls, fn) {
    return '<button class="nw-btn ' + (cls || '') + '" data-run="' + label + '">' + label + '</button>';
  }

  /* ---------------- 提示条 ---------------- */
  function flash(text) {
    var d = document.createElement('div');
    d.className = 'nw-flash';
    d.setAttribute('role', 'status');
    d.setAttribute('aria-live', 'polite');
    d.textContent = text;
    ui.appendChild(d);
    setTimeout(function () { d.remove(); }, 1200);
  }

  /* ------------------------------------------------------------------ *
   * 牌堆自适应缩放
   *
   * 背景：塔的层数越多，牌堆以"牌桌中心"为圆心向四周长。无尽模式最高 6 层（162 张）时
   * 上沿会顶到 HUD 的按钮、下沿会压到道具行——顶到按钮的那几张会点不动（按钮吃掉了点击）。
   * 这里在每次发牌后量一次牌堆的实际包围盒，按"允许的纵向区间"反解出合适的缩放比。
   * ------------------------------------------------------------------ */
  function boardHost() { return document.querySelector('#app div[relative][flex-1]'); }

  function boardBand() {
    var bar = el.barwrap.getBoundingClientRect();
    var row = document.querySelector('#app > div > div[h-50px][text-center]');
    var bottom = row ? row.getBoundingClientRect().top - 8 : window.innerHeight - 200;
    return { top: bar.bottom + 8, bottom: bottom };
  }

  /* 牌堆缩放：量两次、线性插值反解可行区间（纵向可用区 + 横向不出屏），
     小牌堆还会**放大到刚好填满**——教程关 9 张牌原来缩在中间一小块，手机上看着太小。
     注意别用公式硬解 transform-origin（牌堆顶部在锚点之上时符号会反，比例会被压到 0.5） */
  function fitBoard() {
    var host = boardHost();
    if (!host) return null;
    var board = boardCards();
    if (board.length < 4) return null;
    var wide = window.innerWidth >= 620;
    var BASE = 1.34;                       // 与 CSS 里的基准一致
    var MAXS = wide ? 1.55 : 1.8;          // 小牌堆最多放大到多少
    var MINS = 0.62;                       // 再小就不好点了
    host.style.transformOrigin = '50% 46%';
    var band = boardBand();
    var vw = window.innerWidth;

    function measure(s) {
      host.style.transform = 'scale(' + s + ')';
      var rs = board.map(function (c) { return c.getBoundingClientRect(); });
      return {
        top: Math.min.apply(null, rs.map(function (r) { return r.top; })),
        bottom: Math.max.apply(null, rs.map(function (r) { return r.bottom; })),
        left: Math.min.apply(null, rs.map(function (r) { return r.left; })),
        right: Math.max.apply(null, rs.map(function (r) { return r.right; })),
      };
    }
    var m1 = measure(BASE);
    var s2 = BASE * 0.7;
    var m2 = measure(s2);
    var ds = BASE - s2;
    var slope = {
      top: (m1.top - m2.top) / ds, bottom: (m1.bottom - m2.bottom) / ds,
      left: (m1.left - m2.left) / ds, right: (m1.right - m2.right) / ds,
    };
    // 每个约束都换算成"缩放不得大于多少"。
    // 注意不要写"当前已满足就直接返回"——那会漏掉"放大到一定程度才越界"的情况（会长到顶住 HUD）。
    var cap = MAXS;
    function limit(v1, sl, bound, isLower) {
      if (isLower) {                                   // v(s) ≥ bound
        if (sl >= 0) return;                           // 放大方向不会让 v 变小 → 不构成上限
        cap = Math.min(cap, BASE + (bound - v1) / sl);
      } else {                                         // v(s) ≤ bound
        if (sl <= 0) return;
        cap = Math.min(cap, BASE + (bound - v1) / sl);
      }
    }
    limit(m1.top, slope.top, band.top, true);
    limit(m1.bottom, slope.bottom, band.bottom, false);
    limit(m1.left, slope.left, 16, true);
    limit(m1.right, slope.right, vw - 16, false);
    var s = Math.max(MINS, Math.min(MAXS, cap));
    host.style.transform = 'scale(' + (Math.round(s * 1000) / 1000) + ')';
    // 再按"可用区中线"把牌堆整体挪一下：塔小的时候不会全挤在上半屏、下半屏空一大片
    var mb = measure(s);
    var dy = Math.round(((band.top + band.bottom) / 2) - ((mb.top + mb.bottom) / 2));
    if (Math.abs(dy) > 2) host.style.transform = 'translateY(' + dy + 'px) scale(' + (Math.round(s * 1000) / 1000) + ')';
    return s;
  }


  function setBar(p) {
    p = Math.max(0, Math.min(1, p || 0));
    el.bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    el.barwrap.setAttribute('aria-valuenow', String(Math.round(p * 100)));
  }

  function updateHud() {
    var i = info(cur);
    if (cur === ENDLESS && endless.on) {
      el.level.innerHTML = '无尽 <small>第 ' + endless.tower + ' 塔</small>';
    } else {
      el.level.innerHTML = '第 ' + cur + ' 关 <small>' + i.name + '</small>';
    }
    var left = boardCards().length + trayCards().length;
    el.left.innerHTML = '剩余 <b>' + left + '</b>';
    if (!playing) el.time.textContent = startAt ? fmtTime(performance.now() - startAt) : '00:00';
  }

  /* ---------------- 开关选关 / 结算面板 ---------------- */
  function openOverlay() { el.overlay.hidden = false; }
  function closeOverlay() { el.overlay.hidden = true; }

  function showLevels() {
    clearAuto();                                         // 防止"难度飙升"的倒计时在选关后把牌局带跑
    var resumable = boardCards().length > 0 || trayCards().length > 0;   // 桌面上还有牌 = 有一关正在进行
    if (playing) { pausedAt = performance.now(); }
    playing = false;                                     // 面板打开期间不做胜负判定
    var total = LEVELS.length;
    var done = progress.cleared.length;
    var starSum = LEVELS.reduce(function (a, lv) { return a + (progress.stars[lv.n] || 0); }, 0);
    var cells = LEVELS.map(function (lv) {
      var locked = lv.n > progress.unlocked;
      var cleared = progress.cleared.indexOf(lv.n) >= 0;
      var best = progress.best[lv.n];
      var st = progress.stars[lv.n] || 0;
      var meta = lv.endless
        ? (progress.endlessBest ? '<em>9 种 · 最高 ' + progress.endlessBest + ' 塔</em>' : '<em>9 种 · 越爬越高</em>')
        : '<em>' + lv.types + ' 种 · ' + lv.tiles + ' 张</em>';
      var sub = lv.endless
        ? '<span class="nw-lv__stars has">🔥</span>'
        : '<span class="nw-lv__stars' + (st ? ' has' : '') + '">' + starRow(st) + '</span>';
      return [
        '<button class="nw-lv' + (locked ? ' is-locked' : '') + (cleared ? ' is-cleared' : '') + (lv.endless ? ' nw-lv--endless' : '') + '"',
        locked ? ' disabled' : '', ' data-lv="' + lv.n + '"',
        ' aria-label="第 ' + lv.n + ' 关 ' + lv.name + (locked ? '（未解锁）' : cleared ? '（已通关，' + st + ' 星）' : '') + '">',
        '<i>' + (locked ? '🔒' : lv.endless ? '🔥' : lv.n) + '</i>',
        '<b>' + lv.name + '</b>',
        meta,
        sub,
        best ? '<span class="nw-lv__time">最快 ' + best + 's</span>' : '',
        '</button>',
      ].join('');
    }).join('');

    var contLabel = '开始第 ' + progress.unlocked + ' 关';
    if (progress.unlocked === 1 && done === 0) contLabel = '开始教程关';
    if (progress.unlocked === ENDLESS) contLabel = '进入无尽模式 🔥';

    el.panel.innerHTML = [
      '<h2 class="nw-title">抓奶蛙</h2>',
      '<p class="nw-sub">堆叠三消 · 共 ' + total + ' 关 · 已通关 ' + done + ' 关 · 星星 ' + starSum + ' / ' + ((total - 1) * 3) + '</p>',
      '<div class="nw-grid">' + cells + '</div>',
      '<div class="nw-actions">',
      resumable ? '<button class="nw-btn nw-btn--lg" data-run="resume">继续游戏</button>' : '',
      '<button class="nw-btn ' + (resumable ? '' : 'nw-btn--lg') + '" data-run="continue">' + contLabel + '</button>',
      '<button class="nw-btn" data-act="leaderboard">🏆 排行榜</button>',
      '<button class="nw-btn" data-run="help">玩法说明</button>',
      '<button class="nw-btn nw-btn--ghost" data-run="reset">重置进度</button>',
      '</div>',
      '<p class="nw-tip">点方块把它抓进托盘，凑齐 <b>3 只相同</b> 自动消除；托盘 <b>9 格</b>全满就失败。' +
      '被压住的方块会变暗，点不动。</p>',
    ].join('');
    openOverlay();
    updateHud();
  }

  /** 中途点"继续游戏"：关面板、恢复计时、不动牌局 */
  function continueGame() {
    closeOverlay();
    if (pausedAt) { startAt += performance.now() - pausedAt; pausedAt = 0; }   // 菜单时间不计入用时
    playing = true;
    updateHud();
  }

  function showHelp() {
    playing = false;
    el.panel.innerHTML = [
      '<h2 class="nw-title">玩法说明</h2>',
      '<p class="nw-sub">抓奶蛙 · 堆叠三消</p>',
      '<ul class="nw-help">',
      '<li><b>点方块</b>：抓进底部木槽，凑齐 3 只相同自动消除</li>',
      '<li><b>被压住</b>的方块会变暗、点不动，先把上面的抓走</li>',
      '<li>木槽共 <b>9 格</b>，塞满且无法消除即失败</li>',
      '<li><b>移出前三个</b>：把木槽最前面三张退回牌堆，救急用</li>',
      '<li><b>回退</b>：撤销上一步（把刚抓的那张还回去）</li>',
      '<li>牌堆布局每一局都是随机的，同一种图案可能被压在下面</li>',
      '<li><b>音乐</b>：背景音乐是循环播放的，右上角 🔊 一键静音（音效 + 音乐）</li>',
      '</ul>',
      '<div class="nw-actions">',
      '<button class="nw-btn nw-btn--lg" data-run="back-levels">回到选关</button>',
      '</div>',
    ].join('');
    openOverlay();
  }

  function showResult(kind, data) {
    playing = false;
    setHold(true);                     // 挡住游戏自带的自动切关，交给玩家点按钮
    var starBlock = data.stars
      ? '<div class="nw-stars" aria-label="获得 ' + data.stars + ' 星">' + starRow(data.stars)
        + '<small>' + (data.starTip || '') + '</small></div>'
      : '';
    el.panel.innerHTML = [
      '<h2 class="nw-title">' + data.title + '</h2>',
      '<p class="nw-sub">' + (data.sub || '') + '</p>',
      starBlock,
      '<div class="nw-stats">' + data.stats.map(function (s) {
        return '<div class="nw-stat"><b>' + s[1] + '</b><span>' + s[0] + '</span></div>';
      }).join('') + '</div>',
      data.tip ? '<p class="nw-tip">' + data.tip + '</p>' : '',
      '<div class="nw-actions">' + data.actions.map(function (a) {
        return '<button class="nw-btn ' + (a.cls === 'primary' ? 'nw-btn--lg' : a.cls === 'ghost' ? 'nw-btn--ghost' : '') + '" data-run="' + a.label + '">' + a.label + '</button>';
      }).join('') + '</div>',
    ].join('');
    data.actions.forEach(function (a) { actions[a.label] = a.fn; });
    openOverlay();
  }

  /* ------------------------------------------------------------------ *
   * 关卡可解性验证：发牌后自动检查，不可解就重发
   *
   * 做法：
   *   1. 从 DOM 读出每张牌的类型 / 坐标 / 层号（z-index）
   *   2. 重建依赖图 —— 与游戏规则一致：上一层里 |Δtop|≤40 且 |Δleft|≤40 的牌算压住它
   *   3. 用多个贪心策略模拟通关（能凑三就凑三 → 能连拿三张的类型 → 随机兜底）
   *   4. 只要有一种策略能清空就认为可解；否则重发，最多 6 次
   * 同时统计"原始发牌不可解率"，用来量化这项优化的价值。
   * ------------------------------------------------------------------ */
  var TRAY_CAP = 9;
  /** 当前托盘容量：构建产物里已改成读 window.__NAIWA_CAP__，无尽模式靠调小它拉高难度 */
  function currentCap() {
    var c = Number(window.__NAIWA_CAP__);
    return c >= 3 && c <= 9 ? c : TRAY_CAP;
  }
  var MAX_REROLL = 10;
  /* 发牌"刁度"门槛：最优解路线占用的托盘格数上限。
     实测（endless-scale.mjs，遮挡方向修正后）：9 种图案下 54 张的第 4 关，
     最优解峰值均值就有 7.4/9，可解率 83%——也就是说"按刁度重发"会把本来能打通、
     只是走得紧的牌换掉，反而变简单。这里只保留"求解器完全找不到通路"这一条重发理由。 */
  var TIGHT_MAX = { 1: 9, 2: 9, 3: 9, 4: 9, 5: 9 };
  function tightMax(lv) { return TIGHT_MAX[lv] || 8; }
  var validatePending = null;
  var lastBoardCount = -1;
  window.__NAIWA_SOLVE__ = [];
  window.__NAIWA_STATS__ = { judged: 0, unsolvableAtFirstTry: 0, tooTightAtFirstTry: 0, rerolls: 0, acceptedTight: 0 };

  /** 正在播"离场动画"的牌：Vue 的 <transition> 会让已抓走的牌在 DOM 里多留 200ms，
      读盘面时必须剔掉，否则同一张牌会被当成"还在牌堆里"（总数对不上，求解器就会算成死局） */
  function isLeaving(el) {
    var cn = el.className || '';
    return /leave-active|leave-to/.test(cn);
  }

  /** 每张牌一个稳定 id：同一层里可能有两张牌算出的 top/left 完全相同（游戏的 i→(row,column)
      映射不是单射），只靠 inline style 认牌会认错，所以第一次读到时就打上标记。 */
  var nwIdSeq = 0;
  function cardKey(c) {
    if (!c.__nwId) c.__nwId = ++nwIdSeq;
    return 'id:' + c.__nwId;
  }

  function readBoardGraph() {
    var out = [];
    [].slice.call(document.querySelectorAll('.card')).forEach(function (c) {
      if (c.closest('div[w-295px]')) return;                       // 托盘里的不算
      if (isLeaving(c)) return;                                    // 刚被抓走、还在离场动画里的不算
      var st = c.getAttribute('style') || '';
      var img = c.querySelector('img');
      if (!img) return;
      var top = parseFloat((/top:\s*(-?[\d.]+)px/.exec(st) || [])[1]);
      var left = parseFloat((/left:\s*(-?[\d.]+)px/.exec(st) || [])[1]);
      var z = parseInt((/z-?index:\s*(-?\d+)/.exec(st) || [])[1], 10);
      if (!isFinite(top) || !isFinite(left)) return;
      out.push({ type: img.getAttribute('alt'), top: top, left: left, layer: isFinite(z) ? z : 0, blockers: [], key: cardKey(c) });
    });
    out.forEach(function (n, i) { n.i = i; });
    out.forEach(function (n, ni) {
      out.forEach(function (p, pi) {
        // 与游戏一致：**高一层**的牌压住它（useGame 里 e.parents.push(node)：
        // perFloorNodes 是下一层(index-1)，被 push 的 node 是上一层(index)，z-index 更大、画在上面）
        if (p.layer === n.layer + 1 && Math.abs(p.top - n.top) <= 40 && Math.abs(p.left - n.left) <= 40) {
          n.blockers.push(p.i);
          return;
        }
        // 隔层压心：游戏的状态只看"上一层"，但更高的牌正好盖住这张牌的中心时，
        // 点击会被上层那张接走 → 物理上就是点不到，必须一起算进前置条件
        if (p.layer > n.layer && Math.abs(p.top - n.top) <= 20 && Math.abs(p.left - n.left) <= 20) {
          n.blockers.push(p.i);
          return;
        }
        // 同一层里 top/left 完全重合：DOM 顺序靠后的画在上面（游戏算行列时不是单射，会撞位）
        if (p.layer === n.layer && p.top === n.top && p.left === n.left && pi > ni) n.blockers.push(p.i);
      });
    });
    return out;
  }

  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var solveFirst = null;          // 本轮试算的第一步（给"提示/自动测试"用）
  var solveSeq = [];              // 本轮的取牌顺序（牌可能被上层别的牌压住点不到，提示时按顺序找可点的）

  function trySolve(nodes, seed, cap, initTray) {
    var CAP = cap || TRAY_CAP;
    var removed = new Uint8Array(nodes.length);
    var left = nodes.length;
    var tray = (initTray || []).slice();
    var maxTray = 0;
    var rnd = mulberry(seed);
    var guard = 0;
    solveFirst = null;
    solveSeq = [];
    while (left > 0 || tray.length) {
      if (guard++ > nodes.length * 4 + 100) return { ok: false, maxTray: maxTray, reason: 'loop' };
      var free = [];
      for (var i = 0; i < nodes.length; i++) {
        if (removed[i]) continue;
        var n = nodes[i], canPick = true;
        for (var b = 0; b < n.blockers.length; b++) if (!removed[n.blockers[b]]) { canPick = false; break; }
        if (canPick) free.push(n);
      }
      if (!free.length) return { ok: false, maxTray: maxTray, reason: 'deadlock' };
      var counts = {}, byType = {};
      tray.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
      free.forEach(function (n) { (byType[n.type] = byType[n.type] || []).push(n); });
      var types = Object.keys(byType);
      var pick = null, k;
      for (k = 0; k < types.length && !pick; k++) if ((counts[types[k]] || 0) === 2) pick = byType[types[k]][0];          // 立刻凑三
      for (k = 0; k < types.length && !pick; k++) if ((counts[types[k]] || 0) === 1 && byType[types[k]].length >= 2) pick = byType[types[k]][0];
      for (k = 0; k < types.length && !pick; k++) if (!counts[types[k]] && byType[types[k]].length >= 3) pick = byType[types[k]][0];
      if (!pick) pick = free[Math.floor(rnd() * free.length)];    // 不同种子 = 不同试法，降低误判
      if (solveFirst === null) solveFirst = pick.type;
      if (solveSeq.length < 400) solveSeq.push({ type: pick.type, key: pick.key });
      tray.push(pick.type);
      removed[pick.i] = 1; left--;
      var same = 0;
      for (k = 0; k < tray.length; k++) if (tray[k] === pick.type) same++;
      if (same >= 3) {
        var need = 3, rest = [];
        for (k = 0; k < tray.length; k++) {
          if (tray[k] === pick.type && need > 0) { need--; continue; }
          rest.push(tray[k]);
        }
        tray = rest;
      }
      if (tray.length > maxTray) maxTray = tray.length;
      // 与游戏一致：托盘塞到上限且这一手没消掉 → 判负
      if (tray.length >= CAP) return { ok: false, maxTray: maxTray, reason: 'tray-full' };
    }
    return { ok: true, maxTray: maxTray, first: solveFirst, seq: solveSeq.slice(0) };
  }

  /** 多种策略里只要有一种能通就算可解；可解时取"峰值最省"的那条线当刁度指标 */
  function judgeLevel(nodes, cap, initTray) {
    var bestFail = { ok: false, maxTray: 0, reason: 'none' };
    var bestOk = null;
    for (var s = 0; s < 6; s++) {
      var r = trySolve(nodes, s * 7919 + 13, cap, initTray);
      if (r.ok) { if (!bestOk || r.maxTray < bestOk.maxTray) bestOk = r; }
      else if (r.maxTray > bestFail.maxTray) bestFail = r;
    }
    return bestOk || bestFail;
  }

  /** 牌堆指纹：用来判断"重发之后是否真的换了一副新牌" */
  function boardSig() {
    var cards = [].slice.call(document.querySelectorAll('.card')).filter(function (c) { return !c.closest('div[w-295px]'); });
    return cards.slice(0, 4).map(function (c) {
      var img = c.querySelector('img');
      return (c.getAttribute('style') || '') + (img ? img.getAttribute('alt') : '');
    }).join('|');
  }

  /** 给某一关挂上"待验证"标记；发牌稳定后由 tick 驱动验证 */
  function armValidation(level, redeal, budgetMs) {
    validatePending = {
      level: level, tries: 0, stable: 0, awaitSig: null, dealCount: 0,
      redeal: redeal || null,
      // 重发只在开局这几秒内做：真发牌后玩家开始点了就不再动牌面（moved 判定兜底）
      deadline: performance.now() + (budgetMs || 4000),
    };
    lastBoardCount = -1;
  }

  /** 由 tick 驱动：牌堆稳定后验证，必要时重发 */
  function runValidator(api) {
    if (!validatePending) return;
    if (el.overlay && !el.overlay.hidden) return;      // 结算/选关面板开着时不算"在玩"，不验证也不重发
    if (boardCards().length === 0) return;
    // 重发之后必须等到"牌堆指纹变了"再验，避免拿旧牌堆反复验
    var sig = boardSig();
    if (validatePending.awaitSig && sig === validatePending.awaitSig) return;
    validatePending.awaitSig = null;

    // 等牌堆连续两次数量不变，确认发牌结束
    if (boardCards().length === lastBoardCount) validatePending.stable = (validatePending.stable || 0) + 1;
    else validatePending.stable = 0;
    if (validatePending.stable < 2) return;

    var nodes = readBoardGraph();
    if (!nodes.length) return;
    if (!validatePending.dealCount) validatePending.dealCount = nodes.length;
    var res = judgeLevel(nodes, currentCap());
    var cap = tightMax(validatePending.level);
    var tooTight = res.ok && res.maxTray > cap;        // 能通，但容错太窄
    validatePending.tries++;
    if (validatePending.tries === 1) {
      window.__NAIWA_STATS__.judged++;
      if (!res.ok) window.__NAIWA_STATS__.unsolvableAtFirstTry++;
      else if (tooTight) window.__NAIWA_STATS__.tooTightAtFirstTry++;
    }
    window.__NAIWA_SOLVE__.push({
      level: validatePending.level, try: validatePending.tries, ok: res.ok,
      maxTray: res.maxTray, cap: cap, reason: res.reason || '', tiles: nodes.length,
      t: Math.round(performance.now()),
    });

    // 玩家已经动过手了（拿过牌 / 托盘里有牌）→ 即便判定为"难"也不再重发，
    // 否则会把玩家正在下的棋直接抹掉。
    var moved = trayCards().length > 0 || boardCards().length < validatePending.dealCount;

    var inBudget = performance.now() < (validatePending.deadline || 0);
    var maxReroll = validatePending.level === ENDLESS ? 12 : MAX_REROLL;   // 无尽模式一条命，宁可多发几副
    if ((!res.ok || tooTight) && !moved && inBudget && validatePending.tries < maxReroll) {
      if (window.__NAIWA_STATS__.rerolls === 0) flash('重新发牌…');
      window.__NAIWA_STATS__.rerolls++;
      validatePending.awaitSig = sig;        // 记下这副"不合格"的指纹
      validatePending.stable = 0;
      // 重发要认模式：无尽模式第 5 关不能用 api.start(5)（那张配置表只有 4 关）
      if (validatePending.redeal) validatePending.redeal();
      else if (api) api.start(validatePending.level);
      return;
    }
    if (!res.ok) { window.__NAIWA_STATS__.acceptedTight++; flash('这关有点难，稳住！'); }   // 试满仍判不可解 → 保留并提示
    else if (tooTight) window.__NAIWA_STATS__.acceptedTight++;
    validatePending = null;
  }

  var actions = {};

  /* "难度飙升"过渡页：过关后不直接切关，先亮出下一关的难度对比，再（倒计时或点按钮）开战 */
  var autoTimer = 0, autoTick = 0;
  function clearAuto() {
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = 0; }
    if (autoTick) { clearInterval(autoTick); autoTick = 0; }
  }

  function dots(n) {
    var s = '<span class="nw-dots">';
    for (var i = 1; i <= 5; i++) s += '<span class="' + (i <= n ? 'on' : '') + '"></span>';
    return s + '</span>';
  }

  /** 倒计时 + 自动开始：文字更新只在 interval 里做，自动开跑交给 timeout（同一时刻两边都动手会互相清掉） */
  function attachAuto(sec, fn, suffix) {
    clearAuto();
    var d = el.panel.querySelector('[data-el="auto"]');
    var tail = suffix || ' 秒后自动开始…';
    var left = sec;
    autoTick = setInterval(function () {
      left--;
      if (left > 0) { if (d) d.textContent = left + tail; return; }
      if (autoTick) { clearInterval(autoTick); autoTick = 0; }
      if (d) d.textContent = '开始！';
    }, 1000);
    autoTimer = setTimeout(function () { clearAuto(); fn(); }, sec * 1000);
  }

  function showNextIntro(nextN) {
    clearAuto();
    playing = false;
    setHold(true);                          // 过渡期间也别让游戏自己切关
    // 挑战关之后的下一站是无尽模式：没有"张数对比"，改成讲规则
    if (nextN === ENDLESS) {
      var cfg1 = endlessTower(1);
      el.panel.innerHTML = [
        '<div class="nw-center"><div class="nw-spike">🔥 无尽模式</div></div>',
        '<h2 class="nw-title nw-title--sm">难度大幅上升</h2>',
        '<p class="nw-sub">清空「挑战关」之后，真正的考验才开始</p>',
        '<div class="nw-compare">',
        '<div class="nw-row"><span>第 1 塔</span><span><b class="up">' + cfg1.layer + ' 层</b><i>·</i><b class="up">' + cfg1.tiles + ' 张</b><i>·</i><b class="up">' + cfg1.cap + ' 格托盘</b></span></div>',
        '<div class="nw-row"><span>每清一塔</span><span><b class="up">再高一层</b>，第 2 塔起托盘收到 ' + endlessTower(2).cap + ' 格</span></div>',
        '<div class="nw-row"><span>容错</span><span><b class="up">托盘满一次即结束</b></span></div>',
        '</div>',
        '<div class="nw-diff"><span>难度</span>' + dots(5) + '</div>',
        '<p class="nw-tip">没有重来，也不能某一塔重新开始；时间一路累计。最高塔数记在选关界面。</p>',
        '<div class="nw-actions">',
        '<button class="nw-btn nw-btn--lg" data-run="开战！">开战！</button>',
        '<button class="nw-btn nw-btn--ghost" data-run="选关">选关</button>',
        '</div>',

    var a = info(cur), b = info(nextN);
